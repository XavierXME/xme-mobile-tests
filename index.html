<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>X&ME · Q2 · Test mobile V10</title>
<style>
:root{color-scheme:dark;--gold:#c49c48}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#20262c;color:#fff;font-family:Arial,sans-serif}body{padding:clamp(8px,2vw,22px)}
main{width:min(1240px,100%);margin:auto}.viewport{position:relative;width:100%;overflow:hidden;touch-action:pan-y}.viewport iframe{position:absolute;top:0;left:0;width:1240px;height:755px;border:0;transform-origin:top left;display:block}
.actions{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px auto;flex-wrap:wrap}.actions button{padding:10px 16px;border-radius:12px;border:1px solid var(--gold);background:#303841;color:#fff;font-size:14px;font-weight:bold;cursor:pointer}.note{font-size:12px;color:#d6d6d6;text-align:center;line-height:1.5}
#close{display:none}body.theater{padding:0;overflow:hidden}body.theater main{position:fixed;inset:0;z-index:20;width:100vw;height:100dvh;max-width:none;background:#20262c;display:flex;align-items:center;justify-content:center}body.theater .viewport{flex:none}body.theater .actions{position:fixed;right:12px;top:8px;z-index:50;margin:0}body.theater #expand,body.theater .note{display:none}body.theater #close{display:block;background:#303841f2}
@media (orientation:landscape){body{padding:4px 8px}.actions{margin:4px auto}.actions button{padding:6px 12px}.note{display:none}}
</style></head><body><main id="main"><div class="viewport" id="viewport"><iframe id="player" src="player.html" title="Capsule Q2 X&ME" allow="autoplay; fullscreen" scrolling="no"></iframe></div><div class="actions"><button id="expand" type="button">⛶ Agrandir / Paysage</button><button id="close" type="button">✕ Réduire</button></div><p class="note">En portrait, la capsule conserve ses proportions. Pour la voir plus grande, passe en paysage ou utilise le bouton Agrandir.</p></main>
<script>
(function(){'use strict';var BASEW=1240,BASEH=755,main=document.getElementById('main'),host=document.getElementById('viewport'),iframe=document.getElementById('player'),expand=document.getElementById('expand'),close=document.getElementById('close');
var theater=false;
function fit(){var landscape=innerWidth>innerHeight;
 var width=theater?innerWidth:Math.min(main.clientWidth,1240);
 var height=theater?innerHeight:Math.max(180,innerHeight-(landscape?65:115));
 var scale=Math.min(width/BASEW,height/BASEH);
 host.style.width=(BASEW*scale)+'px';host.style.height=(BASEH*scale)+'px';iframe.style.transform='scale('+scale+')';
 if(!theater){host.style.margin='0 auto';}else{host.style.margin='auto';}
}
function setTheater(v){theater=v;document.body.classList.toggle('theater',v);fit()}
expand.addEventListener('click',function(){setTheater(true);if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){})}});
close.addEventListener('click',function(){setTheater(false)});
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,150)});fit();
})();
</script></body></html>
